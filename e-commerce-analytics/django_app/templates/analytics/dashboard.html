<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Analytics Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.8.0/dist/chart.min.js"></script>
    <style>
        .metric-card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">E-commerce Analytics Platform</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Dashboard</h1>
        
        <!-- Real-time Metrics -->
        <div class="row mb-4">
            <h3>Real-time Metrics</h3>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100 bg-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Active Users</h5>
                        <h2 id="active-users-count" class="display-4 text-primary">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100 bg-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Page Views</h5>
                        <h2 id="page-views-count" class="display-4 text-success">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100 bg-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Cart Additions</h5>
                        <h2 id="cart-additions-count" class="display-4 text-warning">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100 bg-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Revenue Today</h5>
                        <h2 id="revenue-today" class="display-4 text-danger">-</h2>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Sales Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card metric-card">
                    <div class="card-body">
                        <h5 class="card-title">Daily Sales</h5>
                        <canvas id="sales-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Top Products -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card metric-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Top Products</h5>
                        <canvas id="top-products-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card metric-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Event Distribution</h5>
                        <canvas id="events-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // WebSocket connection for real-time updates
        let ws_scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const dashboardSocket = new WebSocket(
            ws_scheme + '://' + window.location.host + '/ws/dashboard/'
        );

        // Charts
        let salesChart, topProductsChart, eventsChart;
        
        // Initialize charts on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch initial historical data
            fetchSalesData();
            
            // Setup WebSocket event listeners
            setupWebSocket();
        });
        
        function setupWebSocket() {
            dashboardSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                updateRealTimeMetrics(data);
                updateEventsChart(data);
            };

            dashboardSocket.onclose = function(e) {
                console.error('Dashboard socket closed unexpectedly');
            };
        }
        
        function fetchSalesData() {
            fetch('/api/sales-data/')
                .then(response => response.json())
                .then(data => {
                    initializeSalesChart(data.sales_by_day);
                    initializeTopProductsChart(data.top_products);
                });
        }
        
        function updateRealTimeMetrics(data) {
            // Update active users
            document.getElementById('active-users-count').textContent = 
                data.active_users_count || 0;
            
            // Update page views
            const totalPageViews = Object.values(data.page_views || {}).reduce((a, b) => a + b, 0);
            document.getElementById('page-views-count').textContent = totalPageViews;
            
            // Update cart additions
            const cartAdditions = data.event_counts['add_to_cart'] || 0;
            document.getElementById('cart-additions-count').textContent = cartAdditions;
            
            // Update revenue
            document.getElementById('revenue-today').textContent = 
                '$' + (data.total_revenue || 0).toFixed(2);
        }
        
        function initializeSalesChart(salesData) {
            const ctx = document.getElementById('sales-chart').getContext('2d');
            
            // Format data for Chart.js
            const labels = salesData.map(day => `${day.year}-${day.month}-${day.day}`);
            const salesValues = salesData.map(day => day.total_sales);
            const orderCounts = salesData.map(day => day.order_count);
            
            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Sales ($)',
                            data: salesValues,
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            yAxisID: 'y'
                        },
                        {
                            label: 'Orders',
                            data: orderCounts,
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Sales ($)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: {
                                drawOnChartArea: false
                            },
                            title: {
                                display: true,
                                text: 'Order Count'
                            }
                        }
                    }
                }
            });
        }
        
        function initializeTopProductsChart(productsData) {
            const ctx = document.getElementById('top-products-chart').getContext('2d');
            
            // Format data for Chart.js (take top 5)
            const topFive = productsData.slice(0, 5);
            const labels = topFive.map((p, i) => `Product ${i+1}`);
            const revenueValues = topFive.map(p => p.total_revenue);
            
            topProductsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue ($)',
                        data: revenueValues,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Revenue ($)'
                            }
                        }
                    }
                }
            });
            
            // Initialize empty events chart
            initializeEventsChart();
        }
        
        function initializeEventsChart() {
            const ctx = document.getElementById('events-chart').getContext('2d');
            
            eventsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)',
                            'rgba(255, 159, 64, 0.7)',
                            'rgba(201, 203, 207, 0.7)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right'
                        }
                    }
                }
            });
        }
        
        function updateEventsChart(data) {
            if (!eventsChart || !data.event_counts) return;
            
            const eventCounts = data.event_counts;
            const labels = Object.keys(eventCounts);
            const values = Object.values(eventCounts);
            
            eventsChart.data.labels = labels;
            eventsChart.data.datasets[0].data = values;
            eventsChart.update();
        }
    </script>
</body>
</html>
